<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main-container">
        <section id="all-content">
            <div id=" display-section">
                <input type="text" id="user-input">
            </div>
            <div id="keyboard-section">
                <div class="key">AC</div>
                <div class="key">
                    <img src="backspace.png" alt="" style="width: 45px; height: 25px;">
                </div>
                <div class="key">Sq</div>
                <div class="key">&divide;</div>
                <div class="key">1</div>
                <div class="key">2</div>
                <div class="key">3</div>
                <div class="key">x</div>
                <div class="key">4</div>
                <div class="key">5</div>
                <div class="key">6</div>
                <div class="key">-</div>
                <div class="key">7</div>
                <div class="key">8</div>
                <div class="key">9</div>
                <div class="key">+</div>
                <div class="key">%</div>
                <div class="key">0</div>
                <div class="key">.</div>
                <div class="key">=</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
