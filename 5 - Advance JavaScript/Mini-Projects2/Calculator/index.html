<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main-container">
        <section id="all-content">
            <div id=" display-section">
                <input type="text" id="user-input">
            </div>
            <div id="keyboard-section">
                <div class="key func">AC</div>
                <div class="key func">
                    <img src="backspace.png" alt="" style="width: 45px; height: 25px;">
                </div>
                <div class="key func">Sq</div>
                <div class="key func">&divide;</div>
                <div class="key num">1</div>
                <div class="key num">2</div>
                <div class="key num">3</div>
                <div class="key func">x</div>
                <div class="key num">4</div>
                <div class="key num">5</div>
                <div class="key num">6</div>
                <div class="key func">-</div>
                <div class="key num">7</div>
                <div class="key num">8</div>
                <div class="key num">9</div>
                <div class="key func">+</div>
                <div class="key func">%</div>
                <div class="key num">0</div>
                <div class="key func">.</div>
                <div class="key func">=</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
