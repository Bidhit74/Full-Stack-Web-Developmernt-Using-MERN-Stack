<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Changer</title>

    <style>
      main {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 50px;
      }
      div {
        width: 400px;
        height: 220px;
        border: 2px solid black;
      }
      button {
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Generate a random color</h1>
      <button type="button">Color Generator</button>
      <div>This is your new color</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
